# Sourced by musl-clang and the native CMake toolchain. Enable the sanitizer
# policy selected for debug SDK builds.
#
case "${PHP_SDK_VERSION:-8.5}" in
    *-debug)
        MUSL_CLANG_SANITIZE=address
        MUSL_CLANG_COMPILE_FLAGS=(
            -fsanitize=address,undefined,vptr
            -fno-sanitize=function
        )
        MUSL_CLANG_LINK_FLAGS=(
            -fsanitize=address,undefined,vptr
            -fno-sanitize=function
        )
        ;;
esac
