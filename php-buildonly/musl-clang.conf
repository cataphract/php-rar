# Sourced by /usr/local/bin/musl-clang. Enable the sanitizer policy selected
# for debug SDK builds.
case "${PHP_SDK_VERSION:-8.5}" in
    *-debug)
        MUSL_CLANG_SANITIZE_CXX=address
        MUSL_CLANG_COMPILE_FLAGS=(
            -fsanitize=address,undefined
            -fno-sanitize=function
        )
        MUSL_CLANG_LINK_FLAGS=(
            -fsanitize=address,undefined
            -fno-sanitize=function
        )
        ;;
esac
