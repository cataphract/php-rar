# Sourced by musl-clang and the native CMake toolchain in PHP debug images.
#
# -fsanitize=vptr is not part of Clang's "undefined" group (LLVM 21
# Sanitizers.def), so it must be requested explicitly. It is required on the
# LINK side: the instrumented /usr/asan/lib/libc++.so.1 is built with vptr and
# therefore imports __ubsan_vptr_type_cache and
# __ubsan_handle_dynamic_type_cache_miss, and Clang selects the UBSan C++
# runtime (NeedsUbsanCxxRt = Vptr|CFI) from the link command's own sanitizer
# set, never from what the DSOs on the link line need. Without it every C++
# executable link fails under LLD's default --no-allow-shlib-undefined.
# It is repeated on the COMPILE side so our own C++ gets the same checks as
# the standard library it links against. For -shared links Clang leaves out the
# full static sanitizer runtimes; instrumented DSOs retain references that the
# host resolves instead. Harmless for C, where no polymorphic types exist.
MUSL_CLANG_SANITIZE_CXX=address
MUSL_CLANG_COMPILE_FLAGS=(
    -fsanitize=address,undefined,vptr
    -fno-sanitize=function
)
MUSL_CLANG_LINK_FLAGS=(
    -fsanitize=address,undefined,vptr
    -fno-sanitize=function
)
