# Stand-in for the /etc/musl-clang.conf a derived debug image installs. It
# mirrors php-minimal's policy: MUSL_CLANG_SANITIZE alone has to put the
# sanitizer library directory on every link, C and C++ alike.
MUSL_CLANG_SANITIZE=address
MUSL_CLANG_COMPILE_FLAGS=(
    -fsanitize=address,undefined,vptr
    -fno-sanitize=function
)
MUSL_CLANG_LINK_FLAGS=(
    -fsanitize=address,undefined,vptr
    -fno-sanitize=function
)
